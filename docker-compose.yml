version: '3.8'

services:
  # MySQL 8.0 Primary Relational Database
  db:
    image: mysql:8.0
    container_name: saaslink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-SecretRootPassword123!}
      MYSQL_DATABASE: ${DB_DATABASE:-saaslink_db}
      MYSQL_USER: ${DB_USERNAME:-saaslink_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecretRootPassword123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-SecretRootPassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - saaslink-net

  # Redis In-Memory Cache & Message Broker (Tenant Partitioned)
  redis:
    image: redis:7-alpine
    container_name: saaslink-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saaslink-net

  # NestJS API Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saaslink-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-saaslink_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecretRootPassword123!}
      DB_DATABASE: ${DB_DATABASE:-saaslink_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-DevFallbackSecretChangeInProduction987654321}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - server_uploads:/usr/src/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saaslink-net

  # Nginx Reverse Proxy & Client SPA Delivery
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: saaslink-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - saaslink-net

volumes:
  mysql_data:
  redis_data:
  server_uploads:

networks:
  saaslink-net:
    driver: bridge
